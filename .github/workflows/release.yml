name: Release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a ${{ inputs.tag_name }} -m "Release ${{ inputs.tag_name }}"
          git push --tags
  build_binaries:
    needs: [tag]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: "@rules_go//go/toolchain:linux_amd64"
          - goos: linux
            goarch: arm64
            platform: "@rules_go//go/toolchain:linux_arm64"
          - goos: darwin
            goarch: amd64
            platform: "@rules_go//go/toolchain:darwin_amd64"
          - goos: darwin
            goarch: arm64
            platform: "@rules_go//go/toolchain:darwin_arm64"
          - goos: windows
            goarch: amd64
            platform: "@rules_go//go/toolchain:windows_amd64"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.16.0
        with:
          bazelisk-cache: true
      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ inputs.tag_name }}
          PLATFORM: ${{ matrix.platform }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          bazel build //:bazel-compdb --config=release --platforms="${PLATFORM}"
          bin="$(bazel cquery //:bazel-compdb --config=release --platforms="${PLATFORM}" --output=files | head -n1)"
          out="dist/bazel-compdb-${GOOS}-${GOARCH}.tar.gz"
          mkdir -p dist
          tar -czf "${out}" -C "$(dirname "${bin}")" "$(basename "${bin}")"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazel-compdb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  release:
    needs: [tag, build_binaries]
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.4.0
    with:
      prerelease: false
      release_files: "*.tar.gz"
      tag_name: ${{ inputs.tag_name }}
  publish:
    needs: [release]
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.1.0
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: calebzulawski/bazel-central-registry
      attest: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
